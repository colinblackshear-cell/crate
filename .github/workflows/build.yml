name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request stops that pull request's older build, so stale builds don't hold
# up the queue. On main, a newer push replaces a build that is still waiting to start.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Picks the Mac to build on: Colin's own Mac (the "kaleidobox-mac" runner) when it is online,
  # otherwise GitHub's macos-15. Pull requests from forks always use GitHub's Mac.
  pick-mac:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.KB_RUNNER_STATUS_TOKEN }}
          TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          runner='"macos-15"'
          if [ "$TRUSTED" = "true" ] && [ -n "$GH_TOKEN" ]; then
            online=$(gh api "repos/$GITHUB_REPOSITORY/actions/runners" \
              --jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "kaleidobox-mac"))] | length' || echo 0)
            if [ "${online:-0}" -gt 0 ]; then runner='["self-hosted","kaleidobox-mac"]'; fi
          fi
          echo "Building on: $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  mac:
    needs: pick-mac
    runs-on: ${{ fromJSON(needs.pick-mac.outputs.runner) }}
    env:
      # Pull requests build for Apple Silicon only (about half the time). Main and hand runs
      # build the universal (Apple Silicon + Intel) plugins.
      ARCHS: ${{ github.event_name == 'pull_request' && 'arm64' || 'arm64;x86_64' }}
    steps:
      - uses: actions/checkout@v4

      # On Colin's Mac the build folder lives outside the checkout, so each build only
      # recompiles what changed.
      - name: Keep the build folder between runs (Colin's Mac)
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$HOME/kaleidobox-ci/mac-build"
          rm -rf build && ln -s "$HOME/kaleidobox-ci/mac-build" build

      # Programs and sounds saved by an MPC2000XL, from the vMPC2000XL emulator's demo kits.
      # The MPC format tests read and rewrite each one byte for byte.
      # On Colin's Mac they're downloaded once and kept; a download is tried up to 3 times.
      - name: Get real MPC files for the tests
        run: |
          get() {
            rm -rf "$1" && mkdir -p "$1" && cd "$1"
            git init -q
            git remote add origin https://github.com/izzyreal/mpc.git
            git sparse-checkout set resources/demodata
            git fetch -q --depth 1 --filter=blob:none origin 615418ff54c104a5f37cc31880ecf1dd6d76c0c7
            git checkout -q FETCH_HEAD
            touch .complete
          }
          dest="$GITHUB_WORKSPACE/fixtures"
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then dest="$HOME/kaleidobox-ci/mpc-fixtures"; fi
          if [ ! -e "$dest/.complete" ]; then
            for try in 1 2 3; do (get "$dest") && break; [ "$try" = 3 ] && exit 1; sleep 15; done
          fi
          if [ "$dest" != "$GITHUB_WORKSPACE/fixtures" ]; then rm -rf fixtures && ln -s "$dest" fixtures; fi

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="$ARCHS"

      - name: Build
        run: cmake --build build --config Release -- -quiet

      # On Colin's Mac the tests get a throwaway home folder, so they never touch his real
      # ~/Music/Crate or settings.
      - name: Run tests
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            real_home="$HOME"
            sandbox="$RUNNER_TEMP/test-home"
            rm -rf "$sandbox" && mkdir -p "$sandbox/Music" "$sandbox/Documents" "$sandbox/Library/Application Support"
            touch "$RUNNER_TEMP/tests-started"
            HOME="$sandbox" CFFIXED_USER_HOME="$sandbox" ctest --test-dir build -C Release --output-on-failure
            changed=$(find "$real_home/Music/Crate" -newer "$RUNNER_TEMP/tests-started" 2>/dev/null | head -20)
            if [ -n "$changed" ]; then
              echo "::warning::Files in ~/Music/Crate changed while the tests ran (check they were not the tests):"
              echo "$changed"
            fi
          else
            ctest --test-dir build -C Release --output-on-failure
          fi
        env:
          MPC_FIXTURES: ${{ github.workspace }}/fixtures/resources/demodata

      - name: Sign for local use
        run: |
          cd "build/tools/editor/SampleEditor_artefacts/Release"
          codesign --force --deep -s - "AU/Sample Editor.component"
          codesign --force --deep -s - "VST3/Sample Editor.vst3"
          codesign --force --deep -s - "Standalone/Sample Editor.app"
          cd "$GITHUB_WORKSPACE/build/tools/editor/SampleInstrument_artefacts/Release"
          codesign --force --deep -s - "AU/Sample Editor Instrument.component"
          codesign --force --deep -s - "VST3/Sample Editor Instrument.vst3"
          cd "$GITHUB_WORKSPACE/build/tools/mpc/MpcBankBuilder_artefacts/Release"
          codesign --force --deep -s - "AU/MPC Bank Builder.component"
          codesign --force --deep -s - "VST3/MPC Bank Builder.vst3"
          codesign --force --deep -s - "Standalone/MPC Bank Builder.app"
          for t in Bass Synth Drums; do
            cd "$GITHUB_WORKSPACE/build/tools/$(echo $t | tr A-Z a-z)/Kaleidobox${t}_artefacts/Release"
            codesign --force --deep -s - "Standalone/Kaleidobox $t.app"
          done
          # The box's tools on their own tracks: Kaleidobox MPC, Bass, Synth, Drums (AU + VST3), Vocoder (AU).
          for t in Mpc:MPC Bass:Bass Synth:Synth Drums:Drums; do
            cd "$GITHUB_WORKSPACE/build/tools/rig/Kaleidobox${t%%:*}Plugin_artefacts/Release"
            codesign --force --deep -s - "AU/Kaleidobox ${t##*:}.component"
            codesign --force --deep -s - "VST3/Kaleidobox ${t##*:}.vst3"
          done
          cd "$GITHUB_WORKSPACE/build/tools/rig/KaleidoboxVocoderPlugin_artefacts/Release"
          codesign --force --deep -s - "AU/Kaleidobox Vocoder.component"
          cd "$GITHUB_WORKSPACE/build/tools/rig/Kaleidobox_artefacts/Release"
          codesign --force --deep -s - "Kaleidobox.app"
          cd "$GITHUB_WORKSPACE/build/tools/rig/KaleidoboxPlugin_artefacts/Release"
          codesign --force --deep -s - "AU/Kaleidobox.component"
          codesign --force --deep -s - "VST3/Kaleidobox.vst3"
          cd "$GITHUB_WORKSPACE/build/tools/rig/KaleidoboxInputPlugin_artefacts/Release"
          codesign --force --deep -s - "AU/Kaleidobox Input.component"

      # On Colin's Mac, set aside any copies of these plugins in his own Plug-Ins folder first;
      # the step after the check puts them back (even if the check fails).
      - name: Set aside your own plugin copies (Colin's Mac)
        if: runner.environment == 'self-hosted'
        run: |
          comps="$HOME/Library/Audio/Plug-Ins/Components"
          stash="$HOME/kaleidobox-ci/au-stash"
          mkdir -p "$comps" "$stash"
          # .active means a check is under way (or one was cut off): his copies are already in the stash.
          if [ ! -e "$stash/.active" ]; then
            for n in "Sample Editor" "Sample Editor Instrument" "MPC Bank Builder" "Kaleidobox" "Kaleidobox Input" \
                     "Kaleidobox MPC" "Kaleidobox Bass" "Kaleidobox Synth" "Kaleidobox Drums" "Kaleidobox Vocoder"; do
              if [ -e "$comps/$n.component" ]; then mv "$comps/$n.component" "$stash/"; fi
            done
            touch "$stash/.active"
          fi

      - name: Validate the Audio Unit (what Logic checks)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/tools/editor/SampleEditor_artefacts/Release/AU/Sample Editor.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/tools/editor/SampleInstrument_artefacts/Release/AU/Sample Editor Instrument.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          cp -R "build/tools/mpc/MpcBankBuilder_artefacts/Release/AU/MPC Bank Builder.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aumf CSed Cblk
          auval -v aumu CSei Cblk
          auval -v aumu CMbb Cblk
          cp -R "build/tools/rig/KaleidoboxPlugin_artefacts/Release/AU/Kaleidobox.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aumu CRig Cblk
          cp -R "build/tools/rig/KaleidoboxInputPlugin_artefacts/Release/AU/Kaleidobox Input.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aumf CRgI Cblk
          for t in Mpc:MPC Bass:Bass Synth:Synth Drums:Drums Vocoder:Vocoder; do
            cp -R "build/tools/rig/Kaleidobox${t%%:*}Plugin_artefacts/Release/AU/Kaleidobox ${t##*:}.component" ~/Library/Audio/Plug-Ins/Components/
          done
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aumu CRgM Cblk
          auval -v aumu CBas Cblk
          auval -v aumu CSyn Cblk
          auval -v aumu CDrm Cblk
          auval -v aumf CRgV Cblk

      - name: Put your own plugin copies back (Colin's Mac)
        if: always() && runner.environment == 'self-hosted'
        run: |
          comps="$HOME/Library/Audio/Plug-Ins/Components"
          stash="$HOME/kaleidobox-ci/au-stash"
          [ -e "$stash/.active" ] || exit 0
          for n in "Sample Editor" "Sample Editor Instrument" "MPC Bank Builder" "Kaleidobox" "Kaleidobox Input" \
                   "Kaleidobox MPC" "Kaleidobox Bass" "Kaleidobox Synth" "Kaleidobox Drums" "Kaleidobox Vocoder"; do
            rm -rf "$comps/$n.component"
            if [ -e "$stash/$n.component" ]; then mv "$stash/$n.component" "$comps/"; fi
          done
          rm -f "$stash/.active"
          killall -9 AudioComponentRegistrar || true

      - name: Package
        run: |
          mkdir -p dist
          cd "build/tools/editor/SampleEditor_artefacts/Release"
          ditto -c -k --keepParent "Standalone/Sample Editor.app" "$GITHUB_WORKSPACE/dist/Sample-Editor-App.zip"
          ditto -c -k --keepParent "AU/Sample Editor.component" "$GITHUB_WORKSPACE/dist/Sample-Editor-AU.zip"
          ditto -c -k --keepParent "VST3/Sample Editor.vst3" "$GITHUB_WORKSPACE/dist/Sample-Editor-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/tools/editor/SampleInstrument_artefacts/Release"
          ditto -c -k --keepParent "AU/Sample Editor Instrument.component" "$GITHUB_WORKSPACE/dist/Sample-Editor-Instrument-AU.zip"
          ditto -c -k --keepParent "VST3/Sample Editor Instrument.vst3" "$GITHUB_WORKSPACE/dist/Sample-Editor-Instrument-VST3.zip"
          mkdir -p "$GITHUB_WORKSPACE/dist-mpc"
          cd "$GITHUB_WORKSPACE/build/tools/mpc/MpcBankBuilder_artefacts/Release"
          ditto -c -k --keepParent "Standalone/MPC Bank Builder.app" "$GITHUB_WORKSPACE/dist-mpc/MPC-Bank-Builder-App.zip"
          ditto -c -k --keepParent "AU/MPC Bank Builder.component" "$GITHUB_WORKSPACE/dist-mpc/MPC-Bank-Builder-AU.zip"
          ditto -c -k --keepParent "VST3/MPC Bank Builder.vst3" "$GITHUB_WORKSPACE/dist-mpc/MPC-Bank-Builder-VST3.zip"
          mkdir -p "$GITHUB_WORKSPACE/dist-rig"
          cd "$GITHUB_WORKSPACE/build/tools/rig/Kaleidobox_artefacts/Release"
          ditto -c -k --keepParent "Kaleidobox.app" "$GITHUB_WORKSPACE/dist-rig/Kaleidobox-App.zip"
          cd "$GITHUB_WORKSPACE/build/tools/rig/KaleidoboxPlugin_artefacts/Release"
          ditto -c -k --keepParent "AU/Kaleidobox.component" "$GITHUB_WORKSPACE/dist-rig/Kaleidobox-AU.zip"
          ditto -c -k --keepParent "VST3/Kaleidobox.vst3" "$GITHUB_WORKSPACE/dist-rig/Kaleidobox-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/tools/rig/KaleidoboxInputPlugin_artefacts/Release"
          ditto -c -k --keepParent "AU/Kaleidobox Input.component" "$GITHUB_WORKSPACE/dist-rig/Kaleidobox-Input-AU.zip"
          for t in Bass Synth Drums; do
            cd "$GITHUB_WORKSPACE/build/tools/$(echo $t | tr A-Z a-z)/Kaleidobox${t}_artefacts/Release"
            ditto -c -k --keepParent "Standalone/Kaleidobox $t.app" "$GITHUB_WORKSPACE/dist-rig/Kaleidobox-$t-App.zip"
          done
          for t in Mpc:MPC Bass:Bass Synth:Synth Drums:Drums; do
            cd "$GITHUB_WORKSPACE/build/tools/rig/Kaleidobox${t%%:*}Plugin_artefacts/Release"
            ditto -c -k --keepParent "AU/Kaleidobox ${t##*:}.component" "$GITHUB_WORKSPACE/dist-rig/Kaleidobox-${t##*:}-AU.zip"
            ditto -c -k --keepParent "VST3/Kaleidobox ${t##*:}.vst3" "$GITHUB_WORKSPACE/dist-rig/Kaleidobox-${t##*:}-VST3.zip"
          done
          cd "$GITHUB_WORKSPACE/build/tools/rig/KaleidoboxVocoderPlugin_artefacts/Release"
          ditto -c -k --keepParent "AU/Kaleidobox Vocoder.component" "$GITHUB_WORKSPACE/dist-rig/Kaleidobox-Vocoder-AU.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Sample-Editor-mac
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Bank-Builder-mac
          path: dist-mpc/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Kaleidobox-mac
          path: dist-rig/*.zip

  # The same tests on Linux, which is quicker to start than a Mac runner.
  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Programs and sounds saved by an MPC2000XL, from the vMPC2000XL emulator's demo kits.
      # The MPC format tests read and rewrite each one byte for byte.
      - name: Get real MPC files for the tests
        run: |
          mkdir fixtures && cd fixtures
          git init -q
          git remote add origin https://github.com/izzyreal/mpc.git
          git sparse-checkout set resources/demodata
          git fetch -q --depth 1 --filter=blob:none origin 615418ff54c104a5f37cc31880ecf1dd6d76c0c7
          git checkout -q FETCH_HEAD
      - name: Install libraries JUCE needs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libgl1-mesa-dev ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target CrateTests MpcFormatTests
      - run: ctest --test-dir build --output-on-failure
        env:
          MPC_FIXTURES: ${{ github.workspace }}/fixtures/resources/demodata
      - name: Phone app tests
        run: node --test tests/phone/*.test.mjs
        env:
          MPC_FIXTURES: ${{ github.workspace }}/fixtures/resources/demodata
