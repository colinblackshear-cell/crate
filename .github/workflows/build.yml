name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Programs and sounds saved by an MPC2000XL, from the vMPC2000XL emulator's demo kits.
      # The MPC format tests read and rewrite each one byte for byte.
      - name: Get real MPC files for the tests
        run: |
          mkdir fixtures && cd fixtures
          git init -q
          git remote add origin https://github.com/izzyreal/mpc.git
          git sparse-checkout set resources/demodata
          git fetch -q --depth 1 --filter=blob:none origin 615418ff54c104a5f37cc31880ecf1dd6d76c0c7
          git checkout -q FETCH_HEAD

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -- -quiet

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          MPC_FIXTURES: ${{ github.workspace }}/fixtures/resources/demodata

      - name: Sign for local use
        run: |
          cd "build/tools/editor/SampleEditor_artefacts/Release"
          codesign --force --deep -s - "AU/Sample Editor.component"
          codesign --force --deep -s - "VST3/Sample Editor.vst3"
          codesign --force --deep -s - "Standalone/Sample Editor.app"
          cd "$GITHUB_WORKSPACE/build/tools/editor/SampleInstrument_artefacts/Release"
          codesign --force --deep -s - "AU/Sample Editor Instrument.component"
          codesign --force --deep -s - "VST3/Sample Editor Instrument.vst3"
          cd "$GITHUB_WORKSPACE/build/tools/mpc/MpcBankBuilder_artefacts/Release"
          codesign --force --deep -s - "AU/MPC Bank Builder.component"
          codesign --force --deep -s - "VST3/MPC Bank Builder.vst3"
          codesign --force --deep -s - "Standalone/MPC Bank Builder.app"
          for t in Bass Synth Drums; do
            cd "$GITHUB_WORKSPACE/build/tools/$(echo $t | tr A-Z a-z)/Crate${t}_artefacts/Release"
            codesign --force --deep -s - "AU/Crate $t.component"
            codesign --force --deep -s - "VST3/Crate $t.vst3"
            codesign --force --deep -s - "Standalone/Crate $t.app"
          done
          cd "$GITHUB_WORKSPACE/build/tools/rig/Kaleidobox_artefacts/Release"
          codesign --force --deep -s - "Kaleidobox.app"
          cd "$GITHUB_WORKSPACE/build/tools/rig/KaleidoboxPlugin_artefacts/Release"
          codesign --force --deep -s - "AU/Kaleidobox.component"
          codesign --force --deep -s - "VST3/Kaleidobox.vst3"

      - name: Validate the Audio Unit (what Logic checks)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/tools/editor/SampleEditor_artefacts/Release/AU/Sample Editor.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/tools/editor/SampleInstrument_artefacts/Release/AU/Sample Editor Instrument.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          cp -R "build/tools/mpc/MpcBankBuilder_artefacts/Release/AU/MPC Bank Builder.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aumf CSed Cblk
          auval -v aumu CSei Cblk
          auval -v aumu CMbb Cblk
          cp -R "build/tools/bass/CrateBass_artefacts/Release/AU/Crate Bass.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/tools/synth/CrateSynth_artefacts/Release/AU/Crate Synth.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aumu CBas Cblk
          auval -v aumu CSyn Cblk
          cp -R "build/tools/drums/CrateDrums_artefacts/Release/AU/Crate Drums.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aumu CDrm Cblk
          cp -R "build/tools/rig/KaleidoboxPlugin_artefacts/Release/AU/Kaleidobox.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aumu CRig Cblk

      - name: Package
        run: |
          mkdir -p dist
          cd "build/tools/editor/SampleEditor_artefacts/Release"
          ditto -c -k --keepParent "Standalone/Sample Editor.app" "$GITHUB_WORKSPACE/dist/Sample-Editor-App.zip"
          ditto -c -k --keepParent "AU/Sample Editor.component" "$GITHUB_WORKSPACE/dist/Sample-Editor-AU.zip"
          ditto -c -k --keepParent "VST3/Sample Editor.vst3" "$GITHUB_WORKSPACE/dist/Sample-Editor-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/tools/editor/SampleInstrument_artefacts/Release"
          ditto -c -k --keepParent "AU/Sample Editor Instrument.component" "$GITHUB_WORKSPACE/dist/Sample-Editor-Instrument-AU.zip"
          ditto -c -k --keepParent "VST3/Sample Editor Instrument.vst3" "$GITHUB_WORKSPACE/dist/Sample-Editor-Instrument-VST3.zip"
          mkdir -p "$GITHUB_WORKSPACE/dist-mpc"
          cd "$GITHUB_WORKSPACE/build/tools/mpc/MpcBankBuilder_artefacts/Release"
          ditto -c -k --keepParent "Standalone/MPC Bank Builder.app" "$GITHUB_WORKSPACE/dist-mpc/MPC-Bank-Builder-App.zip"
          ditto -c -k --keepParent "AU/MPC Bank Builder.component" "$GITHUB_WORKSPACE/dist-mpc/MPC-Bank-Builder-AU.zip"
          ditto -c -k --keepParent "VST3/MPC Bank Builder.vst3" "$GITHUB_WORKSPACE/dist-mpc/MPC-Bank-Builder-VST3.zip"
          mkdir -p "$GITHUB_WORKSPACE/dist-rig"
          cd "$GITHUB_WORKSPACE/build/tools/rig/Kaleidobox_artefacts/Release"
          ditto -c -k --keepParent "Kaleidobox.app" "$GITHUB_WORKSPACE/dist-rig/Kaleidobox-App.zip"
          cd "$GITHUB_WORKSPACE/build/tools/rig/KaleidoboxPlugin_artefacts/Release"
          ditto -c -k --keepParent "AU/Kaleidobox.component" "$GITHUB_WORKSPACE/dist-rig/Kaleidobox-AU.zip"
          ditto -c -k --keepParent "VST3/Kaleidobox.vst3" "$GITHUB_WORKSPACE/dist-rig/Kaleidobox-VST3.zip"
          for t in Bass Synth Drums; do
            cd "$GITHUB_WORKSPACE/build/tools/$(echo $t | tr A-Z a-z)/Crate${t}_artefacts/Release"
            ditto -c -k --keepParent "Standalone/Crate $t.app" "$GITHUB_WORKSPACE/dist-rig/Crate-$t-App.zip"
            ditto -c -k --keepParent "AU/Crate $t.component" "$GITHUB_WORKSPACE/dist-rig/Crate-$t-AU.zip"
            ditto -c -k --keepParent "VST3/Crate $t.vst3" "$GITHUB_WORKSPACE/dist-rig/Crate-$t-VST3.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Sample-Editor-mac
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Bank-Builder-mac
          path: dist-mpc/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Kaleidobox-mac
          path: dist-rig/*.zip

  # The same tests on Linux, which is quicker to start than a Mac runner.
  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Programs and sounds saved by an MPC2000XL, from the vMPC2000XL emulator's demo kits.
      # The MPC format tests read and rewrite each one byte for byte.
      - name: Get real MPC files for the tests
        run: |
          mkdir fixtures && cd fixtures
          git init -q
          git remote add origin https://github.com/izzyreal/mpc.git
          git sparse-checkout set resources/demodata
          git fetch -q --depth 1 --filter=blob:none origin 615418ff54c104a5f37cc31880ecf1dd6d76c0c7
          git checkout -q FETCH_HEAD
      - name: Install libraries JUCE needs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libgl1-mesa-dev ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target CrateTests MpcFormatTests
      - run: ctest --test-dir build --output-on-failure
        env:
          MPC_FIXTURES: ${{ github.workspace }}/fixtures/resources/demodata
      - name: Phone app tests
        run: node --test tests/phone/*.test.mjs
        env:
          MPC_FIXTURES: ${{ github.workspace }}/fixtures/resources/demodata
